<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Importação do Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js"></script> -->

    <title>Cadastro de Novos Usuários</title>

    <!-- Styles -->
    <link rel="stylesheet" href="./cadastro-usuarios.css" />
  </head>

  <body>
    <div class="container">
      <!-- 👤 MENSAGEM DE BOAS-VINDAS ADICIONADA -->
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-top: 15px;
          margin-bottom: 5px;
          flex-wrap: wrap;
          gap: 10px;
        "
      >
        <span
          id="mensagem-boas-vindas"
          style="font-weight: 500; color: #555; font-size: 15px"
        ></span>
        <span
          id="badge-nivel"
          style="
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 20px;
          "
        ></span>
      </div>

      <h1>Cadastrar Funcionário</h1>

      <div class="nav-links">
        <a href="../index.html">📦 Produtos</a>
        <a href="../vendas/vendas.html">💰 Histórico de Vendas</a>
        <a href="cadastro-usuarios.html" class="active">👥 Novo Usuário</a>
        <!-- 🚪 BOTÃO DE LOGOUT -->
        <button
          id="btn-logout"
          style="
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
          "
        >
          Sair 🚪
        </button>
      </div>

      <form id="form-cadastro-usuario">
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" required placeholder="Ex: João Silva" />
        </div>

        <div class="form-group">
          <label for="email">E-mail de Acesso</label>
          <input
            type="email"
            id="email"
            required
            placeholder="joao@estoque.com"
          />
        </div>

        <div class="form-group">
          <label for="senha">Senha Inicial</label>
          <input
            type="password"
            id="senha"
            required
            placeholder="Mínimo 6 caracteres"
            minlength="6"
          />
        </div>

        <div class="form-group">
          <label for="nivel_acesso">Nível de Permissão (Tabela Lookup)</label>
          <select id="nivel_acesso" required>
            <!-- 💡 Passamos os IDs numéricos corretos correspondentes à tabela niveis_acesso -->
            <option value="1">Administrador (Acesso Total)</option>
            <option value="2">Operador (Apenas Vendas)</option>
          </select>
        </div>

        <button type="submit" class="btn-salvar">Registrar no Sistema</button>
      </form>
    </div>

    <!-- Scripts -->
    <script src="./cadastro-usuarios.js"></script>
  </body>
</html>
