<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Importação do Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js"></script> -->

    <!-- Importação do Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <title>Controle de Vendas</title>

    <!-- Styles -->
    <link rel="stylesheet" href="vendas.css" />
  </head>
  <body>
    <div class="container">
      <!-- 👤 MENSAGEM DE BOAS-VINDAS ADICIONADA -->
      <div class="continer-boas-vindas">
        <span id="mensagem-boas-vindas" class="mensagem-boas-vindas"></span>
        <span id="badge-nivel" class="badge-nivel"></span>
      </div>

      <h1>Histórico de Vendas Arquivadas</h1>

      <div class="links-container">
        <a href="../index.html" class="link-produtos">📦 Produtos</a>
        <a href="vendas.html" class="link-vendas">💰 Histórico de Vendas</a>
        <!-- Injetar este botão condicional ou fixo (o script já barra se for operador) -->
        <a
          href="../cadastro-usuarios/cadastro-usuarios.html"
          id="menu-usuarios"
          class="link-usuarios"
          >👥 Novo Usuário</a
        >

        <!-- 🚪 BOTÃO DE LOGOUT -->
        <button id="btn-logout" class="btn-logout">Sair 🚪</button>
      </div>

      <div class="cards-container">
        <div class="card">
          <div class="card-titulo">📈 Faturamento Acumulado</div>
          <div id="total-faturamento" class="card-valor">R$ 0.00</div>
        </div>
        <div class="card" style="border-left-color: #007bff">
          <div class="card-titulo">🛍️ Total de Itens Vendidos</div>
          <div id="total-itens" class="card-valor">0 un</div>
        </div>
      </div>

      <h2>Gráfico de Faturamento por Produto</h2>
      <div class="grafico">
        <canvas id="graficoVendas"></canvas>
      </div>

      <h2>Pesquisar no Histórico</h2>
      <input
        type="text"
        id="busca-venda"
        placeholder="Filtrar venda pelo nome do produto..."
      />

      <h2>Registros das Vendas</h2>
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>ID Venda</th>
              <th>Produto</th>
              <th>Qtd</th>
              <th>Preço Unitário</th>
              <th>Valor Total</th>
              <th>Data/Hora</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="linhas-vendas"></tbody>
        </table>
      </div>
    </div>

    <!-- Scripts -->
    <script src="vendas.js"></script>
  </body>
</html>
